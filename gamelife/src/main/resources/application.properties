# configuration jpa/hibernate
spring.jpa.properties.hibernate.cache.provider_class=org.hibernate.cache.DisabledCaching
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# configuration certificat
rsa.private-key=classpath:certs/private.pem
rsa.public-key=classpath:certs/public.pem

# configuration email
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.protocol=smtps
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true*

# Afficher les requêtes SQL dans le terminal
spring.jpa.show-sql=true

# Activer le formatage des requêtes SQL pour une meilleure lisibilité
spring.jpa.properties.hibernate.format_sql=true

# Afficher les requêtes SQL générées par Hibernate
logging.level.org.hibernate.SQL=DEBUG

# Afficher les paramètres de liaison dans les requêtes SQL
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
