---
name: Continous Integration

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Launch tests with Maven
        run: |
          cd gamelife
          mvn clean test

  code-analysis:
    needs: [ "backend-tests" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Analyse code and coverage with SonarCloud
        run: |
          cd gamelife
          mvn clean verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  analyze-pr:
    needs: [ "code-analysis" ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests
  build-image:
    needs: [ "backend-tests", "code-analysis", "analyze-pr" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /home/runner/work/Back/Back/gamelife
          push: true
          tags: gamelife22/gamelife:latest