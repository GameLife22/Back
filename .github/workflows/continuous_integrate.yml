---
name: Continous Integration

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Launch tests with Maven
        run: |
          cd gamelife
          mvn clean test

  code-analysis:
    needs: [ "backend-tests" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Analyse code and coverage with SonarCloud
        run: |
          cd gamelife
          mvn clean verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  analyze_pr:
    needs: [ "code-analysis" ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Analyze PR with Claude AI
        id: analyse_claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"

          CLAUDE_PAYLOAD=$(cat <<EOF
          {
            "prompt": "Analyze this PR:\nTitle: $PR_TITLE\nDescription: $PR_BODY",
            "model": "claude-2",
            "max_tokens_to_sample": 300
          }
          EOF
          )

          response=$(curl -s -X POST https://api.anthropic.com/v1/complete \
                        -H "Authorization: Bearer $CLAUDE_API_KEY" \
                        -H "Content-Type: application/json" \
                        -H "anthropic-version: 2023-06-01" \
                        -d "$CLAUDE_PAYLOAD")

          if [ $? -ne 0 ]; then
            echo "Error: Failed to get response from Claude AI"
            echo "Response: $response"
            exit 1
          fi

          echo "Response from Claude AI: $response"

          # Check if the response contains an error
          if echo "$response" | jq -e '.error' > /dev/null; then
            error_message=$(echo "$response" | jq -r '.error.message')
            echo "Error from Claude AI: $error_message"
            exit 1
          fi

          # Extract information for commenting
          SUMMARY=$(echo "$response" | jq -r '.completion')
          SUGGESTIONS=$(echo "$SUMMARY" | grep -i "suggestion" || echo "No specific suggestions.")
          APPROVAL=$(echo "$SUMMARY" | grep -i "recommend" || echo "No clear recommendation.")

          echo "SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "SUGGESTIONS<<EOF" >> $GITHUB_ENV
          echo "$SUGGESTIONS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "APPROVAL<<EOF" >> $GITHUB_ENV
          echo "$APPROVAL" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Comment on PR with Claude AI Analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="**Analysis by Claude AI**
  
          **Summary:**
          ${{ env.SUMMARY }}
  
          **Suggestions:**
          ${{ env.SUGGESTIONS }}
  
          **Recommendation:**
          ${{ env.APPROVAL }}
  
          @${{ github.actor }}, please review the analysis and take appropriate action."
  
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"

  build-image:
    needs: [ "backend-tests", "code-analysis", "analyze_pr" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /home/runner/work/Back/Back/gamelife
          push: true
          tags: gamelife22/gamelife:latest