---
name: Continous Integration

on:
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Launch tests with Maven
        run: |
          cd gamelife
          mvn clean test

  code-analysis:
    needs: [ "backend-tests" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Analyse code and coverage with SonarCloud
        run: |
          cd gamelife
          mvn clean verify sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  analyze-pr:
    needs: [ "code-analysis" ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install required Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Analyze PR with Claude AI
        id: analyse_claude
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
  
          CLAUDE_PAYLOAD=$(cat <<EOF
          {
            "model": "claude-2",
            "prompt": "Human: Analyze this PR:\nTitle: $PR_TITLE\nDescription: $PR_BODY\n\nProvide a summary, suggestions, and a recommendation. Then translate the entire output to French.\n\nAssistant: Certainly! I'll analyze the pull request for you.",
            "max_tokens_to_sample": 500,
            "temperature": 0.7
          }
          EOF
          )
          
          if ! response=$(curl -s -X POST https://api.anthropic.com/v1/complete \
                   -H "x-api-key: $CLAUDE_API_KEY" \
                   -H "Content-Type: application/json" \
                   -H "anthropic-version: 2023-06-01" \
                   -d "$CLAUDE_PAYLOAD"); then
            echo "Error: Failed to get response from Claude AI"
            echo "Curl error: $?"
            exit 1
          fi
  
          if [[ $(echo "$response" | jq -r '.type') == "error" ]]; then
            echo "Error from Claude AI: $(echo "$response" | jq -r '.error.message')"
            exit 1
          fi
  
          # Extract information for commenting
          SUMMARY=$(echo "$response" | jq -r '.completion')
          SUGGESTIONS=$(echo "$SUMMARY" | grep -i "suggestion" || echo "No specific suggestions.")
          APPROVAL=$(echo "$SUMMARY" | grep -i "recommend" || echo "No clear recommendation.")

          echo "SUMMARY<<EOF" >> $GITHUB_ENV
          echo "$SUMMARY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "SUGGESTIONS<<EOF" >> $GITHUB_ENV
          echo "$SUGGESTIONS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "APPROVAL<<EOF" >> $GITHUB_ENV
          echo "$APPROVAL" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Comment on PR with Claude AI Analysis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="**Analyser par Claude AI**
  
          **Résumé:**
          ${{ env.SUMMARY }}
  
          **Suggestions:**
          ${{ env.SUGGESTIONS }}
  
          **Recommendation:**
          ${{ env.APPROVAL }}
  
          @${{ github.actor }}, veuillez examiner l'analyse et prendre les mesures qui s'imposent."
  
          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"

  build-image:
    needs: [ "backend-tests", "code-analysis", "analyze-pr" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: /home/runner/work/Back/Back/gamelife
          push: true
          tags: gamelife22/gamelife:latest